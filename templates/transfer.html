<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">

    <title>Transer Funds | SecureBank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Transfer Funds</h1>
        <p>Send money securely.</p>
        <form method="POST"
              action="{{ url_for('transfer') }}">
              <label for="account_number">
                 Recipient Account Number
              </label>
              <input
                type="text"
                id="account_number"
                name="account_number"
                placeholder="Enter account number"
                required
              >
              <label for="amount">
                Amount
              </label>
              <input
                type="number"
                id="amount"
                name="amount"
                placeholder="0.00"
                min="0.01"
                step="0.01"
                required
              >
              <label for="description">
                Description
              </label>
              <input
                type="text"
                id="description"
                name="descripton"
                placeholder="e.g Rent, Payment"
                maxlength="100"
              >
            <button type="submit">
                Transfer Money
            </button>
        </form>
    </div>
</body>
</html>
