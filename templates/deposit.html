<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">

    <title>Deposit Funds | SecureBank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Deposit Funds</h1>
        <p>Add money securely to your account.</p>
        <form method="POST"
              account="{{ url_for('deposit') }}">
        <label for="amount">
            Amount
        </label>
        <input
        type="number"
        id="amount"
        name="amount"
        placeholder="0.00"
        min="0.01"
        step="0.01"
        required
    >
    <button type="submit">
        Deposit Money
    </button>
    </form>
    </div> 
</body>
</html>
